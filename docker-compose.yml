# 本地开发编排：当前仅包含 PostgreSQL(pgvector)；
# backend / frontend 服务将在「一键部署」任务中补充。
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: personal-kb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中配置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-personal_kb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-personal_kb}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
